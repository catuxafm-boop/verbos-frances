
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Atelier de Conjugaison</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #f2eadc;
  color: #302b35;
  font-family: Arial, sans-serif;
  font-weight: 800;
}

header {
  max-width: 1050px;
  margin: 0 auto 22px;
  padding: 25px;
  text-align: center;
  background: #cdb7e8;
  border: 3px solid #302b35;
  border-radius: 18px;
}

h1 { margin: 0; font-size: 30px; }
header p { margin-bottom: 0; }

main { max-width: 1050px; margin: auto; }

button, select, input {
  font: inherit;
}

button {
  cursor: pointer;
  color: #302b35;
}

.home-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 16px;
}

.home-card {
  min-height: 190px;
  padding: 22px;
  text-align: left;
  border: 3px solid #302b35;
  border-radius: 17px;
  font-size: 19px;
}

.home-card span {
  display: block;
  font-size: 35px;
  margin-bottom: 18px;
}

.purple { background: #cdb7e8; }
.green { background: #c9d9b9; }
.yellow { background: #f0d98d; }
.blue { background: #c2dce8; }
.orange { background: #e5b99a; }

.page { display: none; }
.page.active { display: block; }

.card {
  padding: 22px;
  margin-bottom: 18px;
  background: #fffdf8;
  border: 2px solid #302b35;
  border-radius: 16px;
}

.back {
  margin-bottom: 15px;
  padding: 11px 16px;
  background: #fffdf8;
  border: 2px solid #302b35;
  border-radius: 10px;
}

.action {
  padding: 11px 16px;
  margin: 5px;
  background: #d9c8ed;
  border: 2px solid #302b35;
  border-radius: 10px;
}

select, input {
  padding: 11px;
  border: 2px solid #302b35;
  border-radius: 9px;
  background: white;
  margin: 5px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0 25px;
  background: white;
}

th, td {
  border: 2px solid #302b35;
  padding: 10px 7px;
  text-align: center;
}

th { background: #cdb7e8; }

td:first-child { background: #eee5d6; }

tbody tr:nth-child(even) { background: #f7f3eb; }

.blank {
  height: 38px;
  min-width: 65px;
}

.table-wrap {
  overflow-x: auto;
}

#randomAnswer {
  width: min(100%, 320px);
  display: block;
  margin: 15px 0;
}

.feedback {
  margin-top: 15px;
  font-size: 18px;
}

.person {
  background: #f0d98d;
  padding: 13px;
  border: 2px solid #302b35;
  border-radius: 10px;
  display: inline-block;
  margin: 8px 0;
}

@media(max-width: 650px) {
  body { padding: 10px; }
  h1 { font-size: 24px; }
  .card { padding: 13px; }
  table { min-width: 650px; }
}
</style>
</head>

<body>

<header>
  <h1>Mon Atelier de Conjugaison</h1>
  <p>Je conjugue, je révise et je progresse !</p>
</header>

<main>

<!-- ACCUEIL -->
<section id="home" class="page active">
  <div class="home-grid">

    <button class="home-card purple" onclick="openPage('completed')">
      <span>📚</span>
      Tableaux faits
      <p>Consulter les conjugaisons complètes.</p>
    </button>

    <button class="home-card green" onclick="openPage('blank')">
      <span>✏️</span>
      Tableaux à compléter
      <p>Compléter les tableaux soi-même.</p>
    </button>

    <button class="home-card yellow" onclick="startRandom()">
      <span>🎲</span>
      Mode aléatoire
      <p>Verbe, temps et personne au hasard.</p>
    </button>

  </div>
</section>

<!-- TABLEAUX COMPLETS -->
<section id="completed" class="page">
  <button class="back" onclick="openPage('home')">← Accueil</button>

  <div class="card">
    <h2>📚 Tableaux faits</h2>
    <label>Choisir un verbe :</label>
    <select id="completedSelect" onchange="showCompleted()"></select>
  </div>

  <div id="completedTables"></div>
</section>

<!-- TABLEAUX VIDES -->
<section id="blank" class="page">
  <button class="back" onclick="openPage('home')">← Accueil</button>

  <div class="card">
    <h2>✏️ Tableaux à compléter</h2>
    <p>Toutes les cases sont vides. À toi de conjuguer !</p>

    <label>Choisir un verbe :</label>
    <select id="blankSelect" onchange="showBlank()"></select>
  </div>

  <div id="blankTables"></div>
</section>

<!-- ALEATOIRE -->
<section id="random" class="page">
  <button class="back" onclick="openPage('home')">← Accueil</button>

  <div class="card">
    <h2>🎲 Mode aléatoire</h2>
    <p>Un verbe, un temps et une personne seront choisis au hasard.</p>

    <button class="action" onclick="newRandom()">Nouvelle question 🎲</button>

    <div id="randomQuestion"></div>

    <input id="randomAnswer" placeholder="Écris la conjugaison...">

    <button class="action" onclick="checkRandom()">Vérifier</button>

    <div id="randomFeedback" class="feedback"></div>
  </div>
</section>

</main>

<script>

/* VERBES */

const verbs = {
  etre: {
    name: "ÊTRE",
    present: ["suis","es","est","sommes","êtes","sont"],
    imparfait: ["étais","étais","était","étions","étiez","étaient"],
    futur: ["serai","seras","sera","serons","serez","seront"],
    conditionnel: ["serais","serais","serait","serions","seriez","seraient"],
    passe: ["ai été","as été","a été","avons été","avez été","ont été"],
    subjonctif: ["sois","sois","soit","soyons","soyez","soient"]
  },

  avoir: {
    name: "AVOIR",
    present: ["ai","as","a","avons","avez","ont"],
    imparfait: ["avais","avais","avait","avions","aviez","avaient"],
    futur: ["aurai","auras","aura","aurons","aurez","auront"],
    conditionnel: ["aurais","aurais","aurait","aurions","auriez","auraient"],
    passe: ["ai eu","as eu","a eu","avons eu","avez eu","ont eu"],
    subjonctif: ["aie","aies","ait","ayons","ayez","aient"]
  },

  aller: {
    name: "ALLER",
    present: ["vais","vas","va","allons","allez","vont"],
    imparfait: ["allais","allais","allait","allions","alliez","allaient"],
    futur: ["irai","iras","ira","irons","irez","iront"],
    conditionnel: ["irais","irais","irait","irions","iriez","iraient"],
    passe: ["suis allé(e)","es allé(e)","est allé(e)","sommes allé(e)s","êtes allé(e)(s)","sont allé(e)s"],
    subjonctif: ["aille","ailles","aille","allions","alliez","aillent"]
  },

  faire: {
    name: "FAIRE",
    present: ["fais","fais","fait","faisons","faites","font"],
    imparfait: ["faisais","faisais","faisait","faisions","faisiez","faisaient"],
    futur: ["ferai","feras","fera","ferons","ferez","feront"],
    conditionnel: ["ferais","ferais","ferait","ferions","feriez","feraient"],
    passe: ["ai fait","as fait","a fait","avons fait","avez fait","ont fait"],
    subjonctif: ["fasse","fasses","fasse","fassions","fassiez","fassent"]
  },

  parler: {
    name: "PARLER",
    present: ["parle","parles","parle","parlons","parlez","parlent"],
    imparfait: ["parlais","parlais","parlait","parlions","parliez","parlaient"],
    futur: ["parlerai","parleras","parlera","parlerons","parlerez","parleront"],
    conditionnel: ["parlerais","parlerais","parlerait","parlerions","parleriez","parleraient"],
    passe: ["ai parlé","as parlé","a parlé","avons parlé","avez parlé","ont parlé"],
    subjonctif: ["parle","parles","parle","parlions","parliez","parlent"]
  },

  finir: {
    name: "FINIR",
    present: ["finis","finis","finit","finissons","finissez","finissent"],
    imparfait: ["finissais","finissais","finissait","finissions","finissiez","finissaient"],
    futur: ["finirai","finiras","finira","finirons","finirez","finiront"],
    conditionnel: ["finirais","finirais","finirait","finirions","finiriez","finiraient"],
    passe: ["ai fini","as fini","a fini","avons fini","avez fini","ont fini"],
    subjonctif: ["finisse","finisses","finisse","finissions","finissiez","finissent"]
  },

  prendre: {
    name: "PRENDRE",
    present: ["prends","prends","prend","prenons","prenez","prennent"],
    imparfait: ["prenais","prenais","prenait","prenions","preniez","prenaient"],
    futur: ["prendrai","prendras","prendra","prendrons","prendrez","prendront"],
    conditionnel: ["prendrais","prendrais","prendrait","prendrions","prendriez","prendraient"],
    passe: ["ai pris","as pris","a pris","avons pris","avez pris","ont pris"],
    subjonctif: ["prenne","prennes","prenne","prenions","preniez","prennent"]
  },

  venir: {
    name: "VENIR",
    present: ["viens","viens","vient","venons","venez","viennent"],
    imparfait: ["venais","venais","venait","venions","veniez","venaient"],
    futur: ["viendrai","viendras","viendra","viendrons","viendrez","viendront"],
    conditionnel: ["viendrais","viendrais","viendrait","viendrions","viendriez","viendraient"],
    passe: ["suis venu(e)","es venu(e)","est venu(e)","sommes venu(e)s","êtes venu(e)(s)","sont venu(e)s"],
    subjonctif: ["vienne","viennes","vienne","venions","veniez","viennent"]
  },

  pouvoir: {
    name: "POUVOIR",
    present: ["peux","peux","peut","pouvons","pouvez","peuvent"],
    imparfait: ["pouvais","pouvais","pouvait","pouvions","pouviez","pouvaient"],
    futur: ["pourrai","pourras","pourra","pourrons","pourrez","pourront"],
    conditionnel: ["pourrais","pourrais","pourrait","pourrions","pourriez","pourraient"],
    passe: ["ai pu","as pu","a pu","avons pu","avez pu","ont pu"],
    subjonctif: ["puisse","puisses","puisse","puissions","puissiez","puissent"]
  },

  vouloir: {
    name: "VOULOIR",
    present: ["veux","veux","veut","voulons","voulez","veulent"],
    imparfait: ["voulais","voulais","voulait","voulions","vouliez","voulaient"],
    futur: ["voudrai","voudras","voudra","voudrons","voudrez","voudront"],
    conditionnel: ["voudrais","voudrais","voudrait","voudrions","voudriez","voudraient"],
    passe: ["ai voulu","as voulu","a voulu","avons voulu","avez voulu","ont voulu"],
    subjonctif: ["veuille","veuilles","veuille","voulions","vouliez","veuillent"]
  },

  dire: {
    name: "DIRE",
    present: ["dis","dis","dit","disons","dites","disent"],
    imparfait: ["disais","disais","disait","disions","disiez","disaient"],
    futur: ["dirai","diras","dira","dirons","direz","diront"],
    conditionnel: ["dirais","dirais","dirait","dirions","diriez","diraient"],
    passe: ["ai dit","as dit","a dit","avons dit","avez dit","ont dit"],
    subjonctif: ["dise","dises","dise","disions","disiez","disent"]
  },

  voir: {
    name: "VOIR",
    present: ["vois","vois","voit","voyons","voyez","voient"],
    imparfait: ["voyais","voyais","voyait","voyions","voyiez","voyaient"],
    futur: ["verrai","verras","verra","verrons","verrez","verront"],
    conditionnel: ["verrais","verrais","verrait","verrions","verriez","verraient"],
    passe: ["ai vu","as vu","a vu","avons vu","avez vu","ont vu"],
    subjonctif: ["voie","voies","voie","voyions","voyiez","voient"]
  }
};

/* TEMPS */

const tenseNames = {
  present: "Présent",
  passe: "Passé composé",
  imparfait: "Imparfait",
  futur: "Futur simple",
  conditionnel: "Conditionnel présent",
  subjonctif: "Subjonctif présent"
};

const persons = [
  "Je",
  "Tu",
  "Il / Elle",
  "Nous",
  "Vous",
  "Ils / Elles"
];

const colors = ["purple","green","blue","yellow","orange"];

/* NAVIGATION */

function openPage(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* MENUS */

function createMenus() {
  const options = Object.entries(verbs)
    .map(([key,v]) => `<option value="${key}">${v.name}</option>`)
    .join("");

  document.getElementById("completedSelect").innerHTML = options;
  document.getElementById("blankSelect").innerHTML = options;

  showCompleted();
  showBlank();
}

/* TABLEAUX COMPLETS */

function showCompleted() {
  const key = document.getElementById("completedSelect").value;
  const verb = verbs[key];

  let html = `<div class="card">
    <h2>${verb.name}</h2>
    <div class="table-wrap">
    <table>
    <thead><tr><th>Temps</th>${persons.map(p => `<th>${p}</th>`).join("")}</tr></thead>
    <tbody>`;

  Object.entries(tenseNames).forEach(([tense,label]) => {
    html += `<tr><td>${label}</td>`;
    verb[tense].forEach(answer => html += `<td>${answer}</td>`);
    html += `</tr>`;
  });

  html += `</tbody></table></div></div>`;

  document.getElementById("completedTables").innerHTML = html;
}

/* TABLEAUX VIDES */

function showBlank() {
  const key = document.getElementById("blankSelect").value;
  const verb = verbs[key];

  let html = `<div class="card">
    <h2>${verb.name}</h2>
    <div class="table-wrap">
    <table>
    <thead><tr><th>Temps</th>${persons.map(p => `<th>${p}</th>`).join("")}</tr></thead>
    <tbody>`;

  Object.entries(tenseNames).forEach(([tense,label]) => {
    html += `<tr><td>${label}</td>`;
    persons.forEach(() => html += `<td class="blank"></td>`);
    html += `</tr>`;
  });

  html += `</tbody></table></div></div>`;

  document.getElementById("blankTables").innerHTML = html;
}

/* MODE ALÉATOIRE */

let currentQuestion = null;

function startRandom() {
  openPage("random");
  newRandom();
}

function newRandom() {
  const verbKeys = Object.keys(verbs);
  const tenseKeys = Object.keys(tenseNames);

  const verbKey = verbKeys[Math.floor(Math.random() * verbKeys.length)];
  const tenseKey = tenseKeys[Math.floor(Math.random() * tenseKeys.length)];
  const personIndex = Math.floor(Math.random() * 6);

  currentQuestion = {
    verb: verbKey,
    tense: tenseKey,
    person: personIndex,
    answer: verbs[verbKey][tenseKey][personIndex]
  };

  document.getElementById("randomQuestion").innerHTML = `
    <h3>${verbs[verbKey].name}</h3>
    <p><strong>Temps :</strong> ${tenseNames[tenseKey]}</p>
    <div class="person">${persons[personIndex]}</div>
  `;

  document.getElementById("randomAnswer").value = "";
  document.getElementById("randomFeedback").textContent = "";
  document.getElementById("randomAnswer").focus();
}

function normalize(text) {
  return text
    .toLowerCase()
    .trim()
    .replace(/\s+/g, " ");
}

function checkRandom() {
  if (!currentQuestion) return;

  const answer = normalize(document.getElementById("randomAnswer").value);
  const correct = normalize(currentQuestion.answer);

  const feedback = document.getElementById("randomFeedback");

  if (answer === correct) {
    feedback.textContent = "Bravo ! Bonne réponse !";
    feedback.style.color = "green";
  } else {
    feedback.textContent = "Pas encore ! Réessaie.";
    feedback.style.color = "#a34b35";
  }
}

createMenus();

</script>
</body>
</html>
