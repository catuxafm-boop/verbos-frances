<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Estacionamiento Zen</title>
  <style>
    :root {
      --ink: #594d55;
      --cream: #fff8ed;
      --rose: #f2b6a0;
      --shadow: 0 14px 40px rgba(80, 55, 60, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 15% 5%, rgba(255, 224, 179, .75), transparent 40%),
        linear-gradient(145deg, #f8d9c8, #f5e5d3 55%, #e9d8db);
      font-family: ui-rounded, "Avenir Next", Avenir, system-ui, sans-serif;
      display: flex;
      justify-content: center;
      padding: 18px;
      touch-action: manipulation;
    }

    .app {
      width: min(100%, 1050px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 6px;
    }

    .brand h1 {
      font-size: clamp(1.25rem, 3vw, 1.8rem);
      margin: 0;
      letter-spacing: -.04em;
    }

    .brand p {
      margin: 3px 0 0;
      font-size: .9rem;
      opacity: .76;
    }

    .top-tools {
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(255, 248, 237, .7);
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 999px;
      padding: 7px 12px;
      box-shadow: 0 5px 16px rgba(80, 55, 60, .08);
      font-size: .9rem;
      white-space: nowrap;
    }

    #carColor {
      width: 31px;
      height: 31px;
      padding: 0;
      border: 2px solid white;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      overflow: hidden;
    }

    #carColor::-webkit-color-swatch-wrapper { padding: 0; }
    #carColor::-webkit-color-swatch { border: 0; border-radius: 50%; }

    .stage {
      width: 100%;
      aspect-ratio: 3 / 2;
      max-height: min(66vh, 680px);
      position: relative;
      overflow: hidden;
      border: 6px solid rgba(255, 248, 237, .82);
      border-radius: 24px;
      background: #e8d1b3;
      box-shadow: var(--shadow);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .level-pill {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 8px 13px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 999px;
      background: rgba(255, 248, 237, .83);
      backdrop-filter: blur(8px);
      font-size: .88rem;
      font-weight: 700;
      pointer-events: none;
    }

    .tip {
      position: absolute;
      right: 14px;
      top: 14px;
      max-width: 48%;
      padding: 8px 12px;
      border-radius: 14px;
      background: rgba(255, 248, 237, .77);
      font-size: .82rem;
      text-align: right;
      pointer-events: none;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .pad {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .control-button {
      width: clamp(54px, 8vw, 72px);
      height: clamp(50px, 7vw, 62px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 19px;
      background: rgba(255, 248, 237, .82);
      color: var(--ink);
      box-shadow: 0 7px 16px rgba(80, 55, 60, .10);
      font: inherit;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: transform .12s, background .12s;
    }

    .control-button:active,
    .control-button.pressed {
      transform: translateY(2px) scale(.97);
      background: #ffe3c3;
    }

    .drive-button { font-size: .83rem; }
    .hint-text { font-size: .86rem; opacity: .78; text-align: center; }

    .modal {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(76, 57, 67, .23);
      backdrop-filter: blur(5px);
    }

    .modal.visible { display: flex; }

    .postcard {
      width: min(100%, 390px);
      padding: 26px 25px 22px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 26px;
      background: linear-gradient(155deg, #fffaf0, #ffeedf);
      box-shadow: 0 20px 60px rgba(59, 39, 49, .24);
      text-align: center;
      animation: arrive .45s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes arrive {
      from { transform: translateY(16px) scale(.94); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .postcard .stamp { font-size: 2.2rem; }
    .postcard h2 { margin: 8px 0 6px; font-size: 1.45rem; }
    .postcard p { margin: 0 0 20px; line-height: 1.55; }

    .next-button {
      border: 0;
      border-radius: 999px;
      padding: 12px 21px;
      color: white;
      background: linear-gradient(135deg, #df987d, #c97d83);
      box-shadow: 0 7px 16px rgba(182, 104, 108, .22);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 2px 0 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(89, 77, 85, .2);
    }

    .dot.done { background: #c98276; }

    @media (max-width: 600px) {
      body { padding: 10px; }
      .app { gap: 9px; }
      .stage { max-height: none; border-width: 4px; border-radius: 17px; }
      header { padding: 1px 3px; }
      .brand p { font-size: .78rem; }
      .top-tools { padding: 5px 9px; font-size: .78rem; }
      .tip { font-size: .72rem; }
      .controls { gap: 8px; }
      .pad { gap: 6px; }
      .hint-text { display: none; }
    }

    @media (max-height: 700px) and (min-width: 601px) {
      body { padding-top: 9px; padding-bottom: 9px; }
      .stage { max-height: 62vh; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand">
        <h1>Estacionamiento Zen <span aria-hidden="true">🌇</span></h1>
        <p>Respire, tournez doucement… et prenez votre temps.</p>
      </div>
      <label class="top-tools" for="carColor">
        <span>Couleur de la voiture</span>
        <input id="carColor" type="color" value="#d98272" aria-label="Choisir la couleur de la voiture">
      </label>
    </header>

    <section class="stage" aria-label="Jeu de stationnement">
      <canvas id="game" width="960" height="640" aria-label="Jeu en vue de dessus"></canvas>
      <div class="level-pill" id="levelLabel"></div>
      <div class="tip">Flèches / WASD ou boutons · Aucun stress, aucune limite 🌼</div>

      <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="postcard">
          <div class="stamp" aria-hidden="true">💌✨</div>
          <h2 id="modalTitle">Carte postale débloquée !</h2>
          <p id="messageText"></p>
          <button class="next-button" id="nextButton">Continuer</button>
        </div>
      </div>
    </section>

    <div class="controls" aria-label="Commandes tactiles">
      <div class="pad">
        <button class="control-button" data-control="left" aria-label="Tourner à gauche">↶</button>
        <button class="control-button" data-control="right" aria-label="Tourner à droite">↷</button>
      </div>
      <div class="hint-text">La voiture rebondit doucement contre les bordures et les cônes.</div>
      <div class="pad">
        <button class="control-button drive-button" data-control="reverse" aria-label="Reculer">◀ Reculer</button>
        <button class="control-button drive-button" data-control="forward" aria-label="Avancer">Avancer ▶</button>
      </div>
    </div>

    <div class="progress" id="progress" aria-label="Progression des niveaux"></div>
  </main>

  <script>
    "use strict";

    // Personnalisez ici les quatre dédicaces, une par niveau.
    const MESSAGES_PERSONNALISES = [
      "bravo yoyooo jespere que tu tamusesss.",
      "coucouuuu bravo tas eu encore une etapeee.",
      "t deja a la??? omggggg bravo chouchouuuuu.",
      "tas finis le jeuxxx bravoooooooo je suis fiere de toiiii"
    ];

    const W = 960;
    const H = 640;
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const colorPicker = document.getElementById("carColor");
    const modal = document.getElementById("modal");
    const levelLabel = document.getElementById("levelLabel");
    const progressEl = document.getElementById("progress");

    const levels = [
      {
        name: "La pause-café",
        subtitle: "Une petite place au soleil",
        theme: "cafe",
        start: { x: 175, y: 475, a: -0.12 },
        goal: { x: 748, y: 190, a: Math.PI / 2 },
        obstacles: [{ x: 500, y: 345 }, { x: 564, y: 344 }, { x: 627, y: 344 }],
        decorations: [{ x: 250, y: 180 }, { x: 370, y: 180 }]
      },
      {
        name: "Le belvédère",
        subtitle: "Un coucher de soleil rien que pour vous",
        theme: "lookout",
        start: { x: 170, y: 492, a: -0.18 },
        goal: { x: 755, y: 215, a: 0 },
        obstacles: [{ x: 580, y: 405 }, { x: 640, y: 405 }, { x: 700, y: 405 }, { x: 490, y: 270 }],
        decorations: []
      },
      {
        name: "Le ciné-parc",
        subtitle: "La dernière séance commence bientôt",
        theme: "drivein",
        start: { x: 175, y: 465, a: -0.1 },
        goal: { x: 760, y: 486, a: Math.PI },
        obstacles: [{ x: 450, y: 300 }, { x: 515, y: 300 }, { x: 580, y: 300 }, { x: 645, y: 300 }],
        decorations: []
      },
      {
        name: "Le garage privé",
        subtitle: "Votre petit cocon, enfin à la maison",
        theme: "garage",
        start: { x: 170, y: 500, a: 0 },
        goal: { x: 730, y: 210, a: Math.PI / 2 },
        obstacles: [{ x: 490, y: 435 }, { x: 555, y: 435 }, { x: 620, y: 435 }, { x: 685, y: 435 }],
        decorations: []
      }
    ];

    const input = { forward: false, reverse: false, left: false, right: false };
    const car = { x: 170, y: 475, angle: 0, speed: 0, color: colorPicker.value };
    const carLength = 54;
    const carWidth = 30;
    const cones = [];
    let levelIndex = 0;
    let parkTimer = 0;
    let completed = false;
    let starsTime = 0;
    let lastFrame = 0;

    function loadLevel(index) {
      levelIndex = index;
      const level = levels[levelIndex];
      car.x = level.start.x;
      car.y = level.start.y;
      car.angle = level.start.a;
      car.speed = 0;
      parkTimer = 0;
      completed = false;
      starsTime = 0;
      cones.splice(0, cones.length, ...level.obstacles.map(p => ({ ...p, r: 12 })));
      modal.classList.remove("visible");
      levelLabel.textContent = `Niveau ${levelIndex + 1} / 4 · ${level.name}`;
      renderProgress();
    }

    function renderProgress() {
      progressEl.innerHTML = "";
      levels.forEach((_, i) => {
        const dot = document.createElement("span");
        dot.className = "dot" + (i < levelIndex ? " done" : "");
        dot.setAttribute("aria-label", `Niveau ${i + 1}`);
        progressEl.appendChild(dot);
      });
    }

    function wrapAngle(a) {
      while (a > Math.PI) a -= Math.PI * 2;
      while (a < -Math.PI) a += Math.PI * 2;
      return a;
    }

    function localPosition(x, y, target) {
      const dx = x - target.x;
      const dy = y - target.y;
      const c = Math.cos(target.a);
      const s = Math.sin(target.a);
      return { x: dx * c + dy * s, y: -dx * s + dy * c };
    }

    function isInParkingSpace() {
      const goal = levels[levelIndex].goal;
      const p = localPosition(car.x, car.y, goal);
      const angleDifference = Math.abs(wrapAngle(car.angle - goal.a));
      const parallelDifference = Math.min(angleDifference, Math.abs(Math.PI - angleDifference));
      return Math.abs(p.x) < 24 && Math.abs(p.y) < 13 && parallelDifference < 0.22;
    }

    function update(dt) {
      if (completed) return;

      const steering = (input.right ? 1 : 0) - (input.left ? 1 : 0);
      const throttle = (input.forward ? 1 : 0) - (input.reverse ? 1 : 0);

      car.speed += throttle * 210 * dt;
      car.speed *= Math.exp(-1.25 * dt);
      car.speed = Math.max(-145, Math.min(205, car.speed));

      const speedFactor = Math.min(1, Math.abs(car.speed) / 75);
      if (steering !== 0) {
        const lowSpeedAssist = Math.abs(car.speed) < 8 ? 0.32 : 0;
        car.angle += steering * (0.25 + speedFactor * 1.55 + lowSpeedAssist) *
          Math.sign(car.speed || 1) * dt;
      }

      car.x += Math.cos(car.angle) * car.speed * dt;
      car.y += Math.sin(car.angle) * car.speed * dt;

      bounceFromEdges();
      bounceFromCones();

      const insideAndAligned = isInParkingSpace();
      const goal = levels[levelIndex].goal;

      if (insideAndAligned && Math.abs(car.speed) < 9) {
        parkTimer += dt;
      } else {
        parkTimer = 0;
      }

      if (parkTimer >= 1.5) {
        completeLevel();
      }

      // Garder le halo du parking réactif même lorsque la voiture roule lentement.
      car.goalReady = insideAndAligned;
      car.goal = goal;
    }

    function bounceFromEdges() {
      const marginX = 46;
      const marginY = 44;
      const edges = [
        { hit: car.x < marginX, n: { x: 1, y: 0 }, axis: "x", limit: marginX },
        { hit: car.x > W - marginX, n: { x: -1, y: 0 }, axis: "x", limit: W - marginX },
        { hit: car.y < marginY, n: { x: 0, y: 1 }, axis: "y", limit: marginY },
        { hit: car.y > H - marginY, n: { x: 0, y: -1 }, axis: "y", limit: H - marginY }
      ];

      for (const edge of edges) {
        if (!edge.hit) continue;
        car[edge.axis] = edge.limit;
        const vx = Math.cos(car.angle) * car.speed;
        const vy = Math.sin(car.angle) * car.speed;
        const dot = vx * edge.n.x + vy * edge.n.y;
        const rx = vx - 1.45 * dot * edge.n.x;
        const ry = vy - 1.45 * dot * edge.n.y;
        car.speed = Math.max(34, Math.hypot(rx, ry) * 0.72) * Math.sign(rx * edge.n.x + ry * edge.n.y);
        if (Math.hypot(rx, ry) > 0.1) {
          car.angle = Math.atan2(ry, rx);
          if (car.speed < 0) car.angle = wrapAngle(car.angle + Math.PI);
        }
      }
    }

    function bounceFromCones() {
      for (const cone of cones) {
        const dx = car.x - cone.x;
        const dy = car.y - cone.y;
        const distance = Math.hypot(dx, dy) || 0.001;
        const minDistance = 30 + cone.r;

        if (distance >= minDistance) continue;

        const nx = dx / distance;
        const ny = dy / distance;
        const overlap = minDistance - distance;
        car.x += nx * (overlap + 1);
        car.y += ny * (overlap + 1);

        const vx = Math.cos(car.angle) * car.speed;
        const vy = Math.sin(car.angle) * car.speed;
        const dot = vx * nx + vy * ny;

        // Impulsion douce vers l'extérieur : le véhicule ne reste pas bloqué.
        const rx = vx - 1.45 * Math.min(dot, 0) * nx + nx * 32;
        const ry = vy - 1.45 * Math.min(dot, 0) * ny + ny * 32;
        const magnitude = Math.max(35, Math.hypot(rx, ry) * 0.76);
        car.angle = Math.atan2(ry, rx);
        car.speed = magnitude;
      }
    }

    function completeLevel() {
      completed = true;
      starsTime = 0;
      document.getElementById("messageText").textContent =
        MESSAGES_PERSONNALIZADOS[levelIndex];
      const isLast = levelIndex === levels.length - 1;
      document.getElementById("nextButton").textContent =
        isLast ? "Rejouer les niveaux" : "Niveau suivant";
      modal.classList.add("visible");
      renderProgress();
    }

    function drawRoundedRect(x, y, w, h, radius, fill, stroke) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, radius);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
    }

    function drawBackground() {
      const level = levels[levelIndex];
      ctx.clearRect(0, 0, W, H);

      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, level.theme === "drivein" ? "#d9b4bd" : "#efd7b9");
      sky.addColorStop(1, "#e5cda9");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      // Aire de jeu et bordure douce.
      drawRoundedRect(28, 28, W - 56, H - 56, 32, "#e9d9bd", "#fff3df");
      drawRoundedRect(65, 65, W - 130, H - 130, 28, "#d9c6a9", null);

      // Petits points décoratifs sur le sol.
      ctx.fillStyle = "rgba(255,255,255,.19)";
      for (let x = 95; x < W - 80; x += 68) {
        for (let y = 95; y < H - 70; y += 63) {
          ctx.beginPath();
          ctx.arc(x + ((y / 63) % 2) * 16, y, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      drawTheme(level);
      drawGoal(level.goal);
      drawCones();
      drawCar();
      drawParkingProgress();
      if (completed) drawStars();
    }

    function drawTheme(level) {
      if (level.theme === "cafe") {
        drawRoundedRect(112, 115, 245, 100, 18, "#c47e70", "#f7e1c4");
        drawRoundedRect(130, 132, 210, 62, 12, "#ffe8c9", null);
        ctx.fillStyle = "#795b5a";
        ctx.font = "bold 22px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("☕ LE PETIT CAFÉ", 235, 171);
        drawPlant(390, 166);
        drawPlant(435, 166);
      } else if (level.theme === "lookout") {
        const sun = ctx.createRadialGradient(765, 145, 8, 765, 145, 90);
        sun.addColorStop(0, "rgba(255,224,153,.9)");
        sun.addColorStop(1, "rgba(255,224,153,0)");
        ctx.fillStyle = sun;
        ctx.fillRect(650, 45, 230, 200);
        ctx.fillStyle = "#dc9f7d";
        ctx.beginPath();
        ctx.arc(765, 145, 43, 0, Math.PI * 2);
        ctx.fill();
        drawRoundedRect(110, 125, 365, 46, 20, "#c9b9a2", null);
        ctx.fillStyle = "#f8e9d1";
        ctx.font = "bold 18px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("BELVÉDÈRE DES RÊVES", 290, 155);
        drawFence(95, 235, 765);
      } else if (level.theme === "drivein") {
        drawRoundedRect(630, 110, 220, 135, 14, "#594f63", "#fff0d7");
        drawRoundedRect(647, 127, 186, 98, 9, "#a87582", null);
        ctx.fillStyle = "#fff0d7";
        ctx.font = "bold 21px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("CINÉ-PARC", 740, 168);
        ctx.font = "14px system-ui";
        ctx.fillText("SOIRÉE SOUS LES ÉTOILES", 740, 194);
        drawRoundedRect(125, 132, 325, 60, 16, "#c8a9a2", null);
        ctx.fillStyle = "#fff1df";
        ctx.font = "bold 18px system-ui";
        ctx.fillText("UNE PLACE POUR VOUS", 287, 169);
      } else {
        drawRoundedRect(620, 104, 230, 162, 18, "#b98270", "#f9e5cd");
        drawRoundedRect(646, 128, 178, 116, 12, "#6f6265", null);
        drawRoundedRect(665, 146, 140, 80, 8, "#d7b79a", null);
        ctx.fillStyle = "#fff1df";
        ctx.font = "bold 17px system-ui";
        ctx.textAlign = "center";
        ctx.fillText("CHEZ VOUS", 735, 176);
        ctx.font = "25px system-ui";
        ctx.fillText("⌂", 735, 211);
        drawPlant(555, 150);
      }

      // Détails communs : bordures végétales.
      drawPlant(110, 330);
      drawPlant(850, 335);
      drawPlant(132, 545);
      drawPlant(835, 540);
    }

    function drawPlant(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = "#8b9b76";
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.ellipse((i - 2) * 8, -8 - (i % 2) * 5, 6, 12, (i - 2) * .24, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = "#c98f7b";
      ctx.beginPath();
      ctx.arc(0, 2, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawFence(x1, y, x2) {
      ctx.strokeStyle = "#ad9d88";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
      for (let x = x1; x <= x2; x += 34) {
        ctx.beginPath();
        ctx.moveTo(x, y - 10);
        ctx.lineTo(x, y + 11);
        ctx.stroke();
      }
    }

    function drawGoal(goal) {
      const ready = !!car.goalReady;
      ctx.save();
      ctx.translate(goal.x, goal.y);
      ctx.rotate(goal.a);

      ctx.shadowColor = ready ? "rgba(80,183,130,.65)" : "rgba(255,197,72,.5)";
      ctx.shadowBlur = 20;
      drawRoundedRect(-56, -34, 112, 68, 13,
        ready ? "rgba(104,198,144,.57)" : "rgba(255,211,102,.57)",
        ready ? "#58ad7b" : "#e4ad43");
      ctx.shadowBlur = 0;
      ctx.setLineDash([9, 7]);
      ctx.lineWidth = 3;
      ctx.strokeStyle = ready ? "#f8fff4" : "rgba(255,255,255,.9)";
      ctx.strokeRect(-47, -26, 94, 52);
      ctx.setLineDash([]);

      ctx.fillStyle = ready ? "#2e8158" : "#9b6d2d";
      ctx.font = "bold 13px system-ui";
      ctx.textAlign = "center";
      ctx.fillText(ready ? "PARFAIT !" : "VOTRE PLACE", 0, 5);
      ctx.restore();
    }

    function drawCones() {
      for (const cone of cones) {
        ctx.save();
        ctx.translate(cone.x, cone.y);
        ctx.fillStyle = "rgba(88,65,57,.16)";
        ctx.beginPath();
        ctx.ellipse(2, 8, 14, 7, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#df8d68";
        ctx.beginPath();
        ctx.moveTo(0, -13);
        ctx.lineTo(12, 10);
        ctx.lineTo(-12, 10);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#fff0dc";
        ctx.fillRect(-7, 1, 14, 4);
        ctx.restore();
      }
    }

    function drawCar() {
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.angle);

      // Ombre et carrosserie.
      ctx.fillStyle = "rgba(71, 54, 60, .22)";
      ctx.beginPath();
      ctx.ellipse(2, 5, 31, 19, 0, 0, Math.PI * 2);
      ctx.fill();

      drawRoundedRect(-27, -15, 54, 30, 10, car.color, "#fff3e8");

      // Vitres.
      drawRoundedRect(-9, -11, 20, 22, 6, "rgba(255,244,218,.88)", null);
      drawRoundedRect(11, -10, 9, 20, 4, "rgba(255,231,201,.88)", null);

      // Roues arrière.
      ctx.fillStyle = "#51484b";
      drawRoundedRect(-18, -17, 12, 5, 2, "#51484b", null);
      drawRoundedRect(-18, 12, 12, 5, 2, "#51484b", null);

      // Roues avant qui tournent visuellement avec la direction.
      const wheelTurn = ((input.left ? -1 : 0) + (input.right ? 1 : 0)) * .42;
      ctx.save();
      ctx.translate(17, -14);
      ctx.rotate(wheelTurn);
      drawRoundedRect(-5, -3, 11, 6, 2, "#51484b", null);
      ctx.restore();
      ctx.save();
      ctx.translate(17, 14);
      ctx.rotate(wheelTurn);
      drawRoundedRect(-5, -3, 11, 6, 2, "#51484b", null);
      ctx.restore();

      // Phares.
      ctx.fillStyle = "#fff4c4";
      drawRoundedRect(22, -10, 5, 7, 2, "#fff4c4", null);
      drawRoundedRect(22, 3, 5, 7, 2, "#fff4c4", null);
      ctx.fillStyle = "#e88f82";
      drawRoundedRect(-27, -10, 4, 7, 2, "#e88f82", null);
      drawRoundedRect(-27, 3, 4, 7, 2, "#e88f82", null);
      ctx.restore();
    }

    function drawParkingProgress() {
      if (parkTimer <= 0 || completed) return;
      const goal = levels[levelIndex].goal;
      ctx.save();
      ctx.translate(goal.x, goal.y);
      ctx.rotate(goal.a);
      ctx.strokeStyle = "rgba(255,255,255,.95)";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, 43, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, parkTimer / 1.5));
      ctx.stroke();
      ctx.restore();
    }

    function drawStars() {
      const t = starsTime;
      const cx = levels[levelIndex].goal.x;
      const cy = levels[levelIndex].goal.y;
      for (let i = 0; i < 14; i++) {
        const phase = i * 1.7;
        const radius = 35 + ((t * 70 + i * 19) % 115);
        const x = cx + Math.cos(phase + t * .8) * radius;
        const y = cy + Math.sin(phase + t * .8) * radius * .55;
        const alpha = Math.max(0, 1 - ((t * 70 + i * 19) % 115) / 115);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = i % 2 ? "#fff2ad" : "#fffaf0";
        ctx.font = `${12 + (i % 3) * 5}px system-ui`;
        ctx.textAlign = "center";
        ctx.fillText("★", x, y);
      }
      ctx.globalAlpha = 1;
    }

    function frame(timestamp) {
      const dt = Math.min(.04, lastFrame ? (timestamp - lastFrame) / 1000 : 0);
      lastFrame = timestamp;
      update(dt);
      if (completed) starsTime += dt;
      drawBackground();
      requestAnimationFrame(frame);
    }

    colorPicker.addEventListener("input", () => { car.color = colorPicker.value; });

    document.getElementById("nextButton").addEventListener("click", () => {
      if (levelIndex === levels.length - 1) loadLevel(0);
      else loadLevel(levelIndex + 1);
    });

    const keyMap = {
      ArrowUp: "forward", KeyW: "forward",
      ArrowDown: "reverse", KeyS: "reverse",
      ArrowLeft: "left", KeyA: "left",
      ArrowRight: "right", KeyD: "right"
    };

    window.addEventListener("keydown", event => {
      const control = keyMap[event.code];
      if (!control) return;
      event.preventDefault();
      input[control] = true;
    });

    window.addEventListener("keyup", event => {
      const control = keyMap[event.code];
      if (control) {
        event.preventDefault();
        input[control] = false;
      }
    });

    window.addEventListener("blur", () => {
      Object.keys(input).forEach(key => { input[key] = false; });
    });

    document.querySelectorAll("[data-control]").forEach(button => {
      const control = button.dataset.control;
      const release = event => {
        if (event) event.preventDefault();
        input[control] = false;
        button.classList.remove("pressed");
      };

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        input[control] = true;
        button.classList.add("pressed");
        button.setPointerCapture(event.pointerId);
      });
      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", release);
    });

    loadLevel(0);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
