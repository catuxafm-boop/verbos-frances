
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Atelier de Conjugaison</title>
<style>
:root {
  --bg:#f5eddf; --ink:#302b35; --purple:#b49ada;
  --green:#b4d1a5; --yellow:#f2d477; --blue:#a6cce0;
  --orange:#e9ad89; --white:#fffdf8;
}
* {box-sizing:border-box}
body {
  margin:0; padding:22px; background:var(--bg);
  color:var(--ink); font-family:Arial,sans-serif; font-weight:700;
}
main {max-width:1150px;margin:auto}
h1 {text-align:center;font-size:clamp(28px,5vw,44px)}
h2 {font-size:25px}
p {line-height:1.5}
.page {display:none}
.page.active {display:block}
.subtitle {text-align:center;margin-bottom:30px}
.home-grid {
  display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;margin-top:30px
}
.home-card {
  border:3px solid var(--ink);border-radius:20px;padding:28px 20px;
  min-height:185px;cursor:pointer;text-align:center;color:var(--ink);
  font:inherit;font-size:21px;box-shadow:5px 5px 0 var(--ink);
  transition:transform .15s
}
.home-card:hover {transform:translateY(-4px)}
.home-card span {display:block;font-size:42px;margin-bottom:15px}
.purple {background:var(--purple)}
.green {background:var(--green)}
.yellow {background:var(--yellow)}
.blue {background:var(--blue)}
.orange {background:var(--orange)}
.action {
  border:2px solid var(--ink);border-radius:12px;padding:11px 16px;
  background:var(--white);cursor:pointer;font:inherit;color:var(--ink);
  margin:4px
}
.action:hover {background:var(--yellow)}
.topbar {
  display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:10px;margin-bottom:20px
}
.verb-card {
  background:var(--white);border:2px solid var(--ink);
  border-radius:16px;padding:16px;margin:18px 0;
  box-shadow:3px 3px 0 var(--ink);overflow-x:auto
}
.verb-card h3 {margin-top:0;font-size:23px}
.section-title {
  padding:10px 14px;border-radius:10px;background:var(--blue);
  margin:18px 0 10px
}
table {border-collapse:collapse;width:100%;min-width:650px;margin-bottom:14px}
th,td {border:1.5px solid var(--ink);padding:9px;text-align:center}
th {background:var(--yellow)}
td:first-child {background:#eee5f7;text-align:left}
.controls {display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select,input {
  background:white;border:2px solid var(--ink);border-radius:10px;
  padding:12px;font:inherit;color:var(--ink)
}
.random-box {
  background:var(--white);border:3px solid var(--ink);
  border-radius:20px;padding:25px;max-width:650px;
  margin:25px auto;text-align:center;box-shadow:5px 5px 0 var(--ink)
}
.random-box input {width:100%;margin:15px 0}
#feedback {min-height:28px}
.small {font-size:13px;font-weight:600}
.note {font-size:13px;font-weight:600;opacity:.8}
@media(max-width:600px) {body{padding:13px}}
</style>
</head>
<body>
<main>

<section id="home" class="page active">
  <h1>Mon Atelier de Conjugaison</h1>
  <p class="subtitle">Bienvenue ! Choisis ton atelier de conjugaison.</p>
  <div class="home-grid">
    <button class="home-card purple" onclick="openPage('completed')">
      <span>📚</span>Tableaux faits
      <p class="small">Voir les conjugaisons complètes</p>
    </button>
    <button class="home-card green" onclick="openPage('blank')">
      <span>✏️</span>Tableaux à compléter
      <p class="small">Compléter les cases vides</p>
    </button>
    <button class="home-card yellow" onclick="startRandom()">
      <span>🎲</span>Mode aléatoire
      <p class="small">Verbe, temps et personne au hasard</p>
    </button>
  </div>
</section>

<section id="completed" class="page">
  <div class="topbar">
    <h2>📚 Tableaux faits</h2>
    <button class="action" onclick="openPage('home')">← Accueil</button>
  </div>
  <div id="completedContent"></div>
</section>

<section id="blank" class="page">
  <div class="topbar">
    <h2>✏️ Tableaux à compléter</h2>
    <button class="action" onclick="openPage('home')">← Accueil</button>
  </div>
  <p>Complète les cases avec les bonnes conjugaisons.</p>
  <div id="blankContent"></div>
</section>

<section id="random" class="page">
  <div class="topbar">
    <h2>🎲 Mode aléatoire</h2>
    <button class="action" onclick="openPage('home')">← Accueil</button>
  </div>
  <div class="random-box">
    <p id="randomVerb" style="font-size:30px"></p>
    <p id="randomTense" style="font-size:21px"></p>
    <p id="randomPerson" style="font-size:21px"></p>
    <input id="answer" placeholder="Écris la conjugaison..." autocomplete="off">
    <div>
      <button class="action purple" onclick="checkRandom()">Vérifier</button>
      <button class="action yellow" onclick="newRandom()">Nouvelle question</button>
    </div>
    <p id="feedback"></p>
  </div>
</section>

</main>

<script>
const pronouns = ["Je","Tu","Il / Elle","Nous","Vous","Ils / Elles"];

const verbs = {
  "être": {
    aux:"avoir", pp:"été", present:["suis","es","est","sommes","êtes","sont"],
    imparfait:"ét", simple:["fus","fus","fut","fûmes","fûtes","furent"],
    future:"ser", subj:["sois","sois","soit","soyons","soyez","soient"],
    subjImperfect:"f", participle:"étant", imperative:["sois","soyons","soyez"]
  },
  "avoir": {
    aux:"avoir", pp:"eu", present:["ai","as","a","avons","avez","ont"],
    imparfait:"av", simple:["eus","eus","eut","eûmes","eûtes","eurent"],
    future:"aur", subj:["aie","aies","ait","ayons","ayez","aient"],
    subjImperfect:"e", participle:"ayant", imperative:["aie","ayons","ayez"]
  },
  "aller": {
    aux:"être", pp:"allé", present:["vais","vas","va","allons","allez","vont"],
    imparfait:"all", simple:["allai","allas","alla","allâmes","allâtes","allèrent"],
    future:"ir", subj:["aille","ailles","aille","allions","alliez","aillent"],
    subjImperfect:"alla", participle:"allant", imperative:["va","allons","allez"]
  },
  "faire": {
    aux:"avoir", pp:"fait", present:["fais","fais","fait","faisons","faites","font"],
    imparfait:"fais", simple:["fis","fis","fit","fîmes","fîtes","firent"],
    future:"fer", subj:["fasse","fasses","fasse","fassions","fassiez","fassent"],
    subjImperfect:"fi", participle:"faisant", imperative:["fais","faisons","faites"]
  },
  "parler": {
    aux:"avoir", pp:"parlé", present:["parle","parles","parle","parlons","parlez","parlent"],
    imparfait:"parl", simple:["parlai","parlas","parla","parlâmes","parlâtes","parlèrent"],
    future:"parler", subj:["parle","parles","parle","parlions","parliez","parlent"],
    subjImperfect:"parla", participle:"parlant", imperative:["parle","parlons","parlez"]
  },
  "finir": {
    aux:"avoir", pp:"fini", present:["finis","finis","finit","finissons","finissez","finissent"],
    imparfait:"finiss", simple:["finis","finis","finit","finîmes","finîtes","finirent"],
    future:"finir", subj:["finisse","finisses","finisse","finissions","finissiez","finissent"],
    subjImperfect:"fini", participle:"finissant", imperative:["finis","finissons","finissez"]
  },
  "prendre": {
    aux:"avoir", pp:"pris", present:["prends","prends","prend","prenons","prenez","prennent"],
    imparfait:"pren", simple:["pris","pris","prit","prîmes","prîtes","prirent"],
    future:"prendr", subj:["prenne","prennes","prenne","prenions","preniez","prennent"],
    subjImperfect:"pri", participle:"prenant", imperative:["prends","prenons","prenez"]
  },
  "venir": {
    aux:"être", pp:"venu", present:["viens","viens","vient","venons","venez","viennent"],
    imparfait:"ven", simple:["vins","vins","vint","vînmes","vîntes","vinrent"],
    future:"viendr", subj:["vienne","viennes","vienne","venions","veniez","viennent"],
    subjImperfect:"vin", participle:"venant", imperative:["viens","venons","venez"]
  },
  "pouvoir": {
    aux:"avoir", pp:"pu", present:["peux","peux","peut","pouvons","pouvez","peuvent"],
    imparfait:"pouv", simple:["pus","pus","put","pûmes","pûtes","purent"],
    future:"pourr", subj:["puisse","puisses","puisse","puissions","puissiez","puissent"],
    subjImperfect:"pu", participle:"pouvant", imperative:null
  },
  "vouloir": {
    aux:"avoir", pp:"voulu", present:["veux","veux","veut","voulons","voulez","veulent"],
    imparfait:"voul", simple:["voulus","voulus","voulut","voulûmes","voulûtes","voulurent"],
    future:"voudr", subj:["veuille","veuilles","veuille","voulions","vouliez","veuillent"],
    subjImperfect:"voul", participle:"voulant", imperative:["veuille","veuillons","veuillez"]
  },
  "dire": {
    aux:"avoir", pp:"dit", present:["dis","dis","dit","disons","dites","disent"],
    imparfait:"dis", simple:["dis","dis","dit","dîmes","dîtes","dirent"],
    future:"dir", subj:["dise","dises","dise","disions","disiez","disent"],
    subjImperfect:"di", participle:"disant", imperative:["dis","disons","dites"]
  },
  "voir": {
    aux:"avoir", pp:"vu", present:["vois","vois","voit","voyons","voyez","voient"],
    imparfait:"voy", simple:["vis","vis","vit","vîmes","vîtes","virent"],
    future:"verr", subj:["voie","voies","voie","voyions","voyiez","voient"],
    subjImperfect:"vi", participle:"voyant", imperative:["vois","voyons","voyez"]
  }
};

const sections = [
  {name:"Indicatif",items:[
    "Présent","Imparfait","Passé simple","Futur simple",
    "Passé composé","Plus-que-parfait","Passé antérieur","Futur antérieur"
  ]},
  {name:"Conditionnel",items:[
    "Conditionnel présent","Conditionnel passé 1re forme",
    "Conditionnel passé 2e forme"
  ]},
  {name:"Subjonctif",items:[
    "Subjonctif présent","Subjonctif passé",
    "Subjonctif imparfait","Subjonctif plus-que-parfait"
  ]},
  {name:"Impératif",items:["Impératif présent","Impératif passé"]},
  {name:"Infinitif",items:["Infinitif présent","Infinitif passé"]},
  {name:"Participe",items:["Participe présent","Participe passé"]}
];

const allTenses = sections.flatMap(s=>s.items);

const endings = {
  imparfait:["ais","ais","ait","ions","iez","aient"],
  future:["ai","as","a","ons","ez","ont"],
  conditional:["ais","ais","ait","ions","iez","aient"],
  subjImperfect:["sse","sses","^t","ssions","ssiez","ssent"]
};

function imperfect(v) {
  return endings.imparfait.map(e=>v.imparfait+e);
}
function future(v) {
  return endings.future.map(e=>v.future+e);
}
function conditional(v) {
  return endings.conditional.map(e=>v.future+e);
}
function subjImperfect(v) {
  return endings.subjImperfect.map(e=>{
    if(e==="^t") return v.subjImperfect+"t";
    return v.subjImperfect+e;
  });
}
function agreePP(v,i) {
  if(v.aux!=="être") return v.pp;
  if(i===2) return v.pp+"e";
  if(i===3 || i===4) return v.pp+"s";
  if(i===5) return v.pp+"es";
  return v.pp;
}
function auxiliary(aux,tense) {
  const v=verbs[aux];
  if(tense==="Présent") return v.present;
  if(tense==="Imparfait") return imperfect(v);
  if(tense==="Passé simple") return v.simple;
  if(tense==="Futur simple") return future(v);
  if(tense==="Conditionnel présent") return conditional(v);
  if(tense==="Subjonctif présent") return v.subj;
  if(tense==="Subjonctif imparfait") return subjImperfect(v);
  return v.present;
}
function compound(v,auxTense) {
  return auxiliary(v.aux,auxTense).map((a,i)=>a+" "+agreePP(v,i));
}
function imperativePast(v) {
  const aux=v.aux==="être" ? ["sois","soyons","soyez"] : ["aie","ayons","ayez"];
  return aux.map((a,i)=>a+" "+agreePP(v,[0,3,4][i]));
}
function conjugate(name,tense) {
  const v=verbs[name];
  switch(tense) {
    case "Présent": return {values:v.present,people:pronouns};
    case "Imparfait": return {values:imperfect(v),people:pronouns};
    case "Passé simple": return {values:v.simple,people:pronouns};
    case "Futur simple": return {values:future(v),people:pronouns};
    case "Passé composé": return {values:compound(v,"Présent"),people:pronouns};
    case "Plus-que-parfait": return {values:compound(v,"Imparfait"),people:pronouns};
    case "Passé antérieur": return {values:compound(v,"Passé simple"),people:pronouns};
    case "Futur antérieur": return {values:compound(v,"Futur simple"),people:pronouns};
    case "Conditionnel présent": return {values:conditional(v),people:pronouns};
    case "Conditionnel passé 1re forme": return {values:compound(v,"Conditionnel présent"),people:pronouns};
    case "Conditionnel passé 2e forme": return {values:compound(v,"Subjonctif imparfait"),people:pronouns};
    case "Subjonctif présent": return {values:v.subj,people:pronouns};
    case "Subjonctif passé": return {values:compound(v,"Subjonctif présent"),people:pronouns};
    case "Subjonctif imparfait": return {values:subjImperfect(v),people:pronouns};
    case "Subjonctif plus-que-parfait": return {values:compound(v,"Subjonctif imparfait"),people:pronouns};
    case "Impératif présent":
      return {values:v.imperative || ["—","—","—"],people:["Tu","Nous","Vous"]};
    case "Impératif passé":
      return {values:imperativePast(v),people:["Tu","Nous","Vous"]};
    case "Infinitif présent": return {values:[name],people:["Infinitif"]};
    case "Infinitif passé": return {values:[(v.aux==="être"?"être":"avoir")+" "+v.pp],people:["Infinitif passé"]};
    case "Participe présent": return {values:[v.participle],people:["Participe présent"]};
    case "Participe passé": return {values:[v.pp],people:["Participe passé"]};
  }
}

function renderTables(blank) {
  let html="";
  Object.keys(verbs).forEach(name=>{
    html+=`<div class="verb-card"><h3>${name}</h3>`;
    sections.forEach(section=>{
      html+=`<div class="section-title">${section.name}</div>`;
      html+=`<table><thead><tr><th>Temps / forme</th>`;
      pronouns.forEach(p=>html+=`<th>${p}</th>`);
      html+=`</tr></thead><tbody>`;
      section.items.forEach(tense=>{
        const result=conjugate(name,tense);
        html+=`<tr><td>${tense}</td>`;
        if(result.values.length===6) {
          result.values.forEach(value=>html+=`<td>${blank?"":value}</td>`);
        } else if(result.values.length===3) {
          html+=`<td>${blank?"":result.values[0]}</td>`;
          html+=`<td>${blank?"":result.values[1]}</td>`;
          html+=`<td>${blank?"":result.values[2]}</td>`;
          html+=`<td></td><td></td><td></td>`;
        } else {
          html+=`<td colspan="6">${blank?"":result.values[0]}</td>`;
        }
        html+="</tr>";
      });
      html+="</tbody></table>";
    });
    html+="</div>";
  });
  return html;
}

function openPage(id) {
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
document.getElementById("completedContent").innerHTML=renderTables(false);
document.getElementById("blankContent").innerHTML=renderTables(true);

let current=null;
function newRandom() {
  const names=Object.keys(verbs);
  const name=names[Math.floor(Math.random()*names.length)];
  const tense=allTenses[Math.floor(Math.random()*allTenses.length)];
  const result=conjugate(name,tense);
  const index=Math.floor(Math.random()*result.values.length);
  current={name,tense,index,answer:result.values[index],person:result.people[index]};
  document.getElementById("randomVerb").textContent=name;
  document.getElementById("randomTense").textContent=tense;
  document.getElementById("randomPerson").textContent=result.people[index];
  document.getElementById("answer").value="";
  document.getElementById("feedback").textContent="";
}
function startRandom() {
  openPage("random");
  newRandom();
}
function checkRandom() {
  if(!current)return;
  const input=document.getElementById("answer").value.trim().toLowerCase().replace(/\s+/g," ");
  const correct=current.answer.trim().toLowerCase().replace(/\s+/g," ");
  const feedback=document.getElementById("feedback");
  if(input===correct) {
    feedback.textContent="Bravo ! C'est correct ! ⭐";
    feedback.style.color="green";
  } else {
    feedback.textContent="La bonne réponse est : "+current.answer;
    feedback.style.color="#a33";
  }
}
</script>
</body>
</html>
