
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Atelier de Conjugaison</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px;
  background: #f3ecdf;
  color: #302b35;
  font-family: Arial, sans-serif;
  font-weight: 700;
}

header {
  max-width: 1100px;
  margin: auto;
  padding: 25px;
  background: #d9c8ed;
  border: 3px solid #302b35;
  border-radius: 18px;
  text-align: center;
}

h1 { margin: 0; font-size: 32px; }

main { max-width: 1100px; margin: 25px auto; }

nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 22px;
}

button, select, input { font: inherit; }

nav button, .action {
  border: 2px solid #302b35;
  border-radius: 12px;
  padding: 12px 18px;
  background: #fffdf8;
  cursor: pointer;
  color: #302b35;
}

nav button.active { background: #bca2df; }

button:hover { filter: brightness(.96); }

.panel { display: none; }
.panel.active { display: block; }

.card {
  padding: 22px;
  margin-bottom: 22px;
  background: #fffdf8;
  border: 2px solid #302b35;
  border-radius: 16px;
}

h2 { margin-top: 0; }

h3 { margin-bottom: 10px; }

select, input {
  padding: 10px;
  border: 2px solid #302b35;
  border-radius: 9px;
  background: white;
  margin: 5px;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0 25px;
  background: white;
}

th, td {
  border: 2px solid #302b35;
  padding: 10px 7px;
  text-align: center;
}

th { background: #d9c8ed; }

td:first-child { background: #eee5d6; }

tbody tr:nth-child(even) { background: #f7f3eb; }

input.answer {
  width: 100%;
  min-width: 65px;
  text-align: center;
  border: 1px solid #8d8296;
}

.verb-title {
  padding: 12px;
  border-radius: 10px;
  background: #d9c8ed;
  border: 2px solid #302b35;
}

.green { background: #d0dfc5; }
.blue { background: #cbdfea; }
.yellow { background: #f0df9f; }
.orange { background: #e8c4a8; }

.result { margin-top: 12px; font-weight: bold; }

@media(max-width: 700px) {
  body { padding: 10px; }
  h1 { font-size: 24px; }
  .card { padding: 12px; overflow-x: auto; }
  table { min-width: 650px; }
}
</style>
</head>

<body>

<header>
  <h1>Mon Atelier de Conjugaison</h1>
  <p>Je révise, je complète et je progresse !</p>
</header>

<main>

<nav>
  <button class="active" onclick="showPanel('practice', this)">✏️ Compléter</button>
  <button onclick="showPanel('tables', this)">📚 Mes tableaux</button>
</nav>

<section id="practice" class="panel active">
  <div class="card">
    <h2>✏️ À toi de compléter !</h2>
    <p>Choisis un verbe et un temps, ou laisse le hasard choisir !</p>

    <label for="practiceVerb">Verbe :</label>
    <select id="practiceVerb" onchange="makePractice()"></select>

    <label for="practiceTense">Temps :</label>
    <select id="practiceTense" onchange="makePractice()"></select>

    <div style="margin:12px 0;">
      <button class="action" onclick="randomVerb()">🎲 Verbe aléatoire</button>
      <button class="action" onclick="randomExercise()">🎲 Exercice aléatoire</button>
    </div>

    <div id="practiceTable"></div>

    <button class="action" onclick="checkPractice()">Vérifier</button>
    <button class="action" onclick="makePractice()">Recommencer</button>

    <div id="practiceResult" class="result"></div>
  </div>
</section>

<section id="tables" class="panel">
  <div class="card">
    <h2>📚 Tous mes tableaux</h2>
    <p>Les temps sont regroupés dans un seul tableau pour chaque verbe.</p>

    <label for="filterVerb">Choisir un verbe :</label>
    <select id="filterVerb" onchange="renderTables()">
      <option value="all">Tous les verbes</option>
    </select>
  </div>

  <div id="allTables"></div>
</section>

</main>

<script>
const pronouns = ["Je","Tu","Il / Elle","Nous","Vous","Ils / Elles"];

const tenses = {
  "Présent": {
    etre: ["suis","es","est","sommes","êtes","sont"],
    avoir: ["ai","as","a","avons","avez","ont"],
    aller: ["vais","vas","va","allons","allez","vont"],
    faire: ["fais","fais","fait","faisons","faites","font"],
    parler: ["parle","parles","parle","parlons","parlez","parlent"],
    finir: ["finis","finis","finit","finissons","finissez","finissent"],
    prendre: ["prends","prends","prend","prenons","prenez","prennent"],
    venir: ["viens","viens","vient","venons","venez","viennent"],
    pouvoir: ["peux","peux","peut","pouvons","pouvez","peuvent"],
    vouloir: ["veux","veux","veut","voulons","voulez","veulent"],
    dire: ["dis","dis","dit","disons","dites","disent"],
    voir: ["vois","vois","voit","voyons","voyez","voient"]
  },

  "Imparfait": {
    etre: ["étais","étais","était","étions","étiez","étaient"],
    avoir: ["avais","avais","avait","avions","aviez","avaient"],
    aller: ["allais","allais","allait","allions","alliez","allaient"],
    faire: ["faisais","faisais","faisait","faisions","faisiez","faisaient"],
    parler: ["parlais","parlais","parlait","parlions","parliez","parlaient"],
    finir: ["finissais","finissais","finissait","finissions","finissiez","finissaient"],
    prendre: ["prenais","prenais","prenait","prenions","preniez","prenaient"],
    venir: ["venais","venais","venait","venions","veniez","venaient"],
    pouvoir: ["pouvais","pouvais","pouvait","pouvions","pouviez","pouvaient"],
    vouloir: ["voulais","voulais","voulait","voulions","vouliez","voulaient"],
    dire: ["disais","disais","disait","disions","disiez","disaient"],
    voir: ["voyais","voyais","voyait","voyions","voyiez","voyaient"]
  },

  "Futur simple": {
    etre: ["serai","seras","sera","serons","serez","seront"],
    avoir: ["aurai","auras","aura","aurons","aurez","auront"],
    aller: ["irai","iras","ira","irons","irez","iront"],
    faire: ["ferai","feras","fera","ferons","ferez","feront"],
    parler: ["parlerai","parleras","parlera","parlerons","parlerez","parleront"],
    finir: ["finirai","finiras","finira","finirons","finirez","finiront"],
    prendre: ["prendrai","prendras","prendra","prendrons","prendrez","prendront"],
    venir: ["viendrai","viendras","viendra","viendrons","viendrez","viendront"],
    pouvoir: ["pourrai","pourras","pourra","pourrons","pourrez","pourront"],
    vouloir: ["voudrai","voudras","voudra","voudrons","voudrez","voudront"],
    dire: ["dirai","diras","dira","dirons","direz","diront"],
    voir: ["verrai","verras","verra","verrons","verrez","verront"]
  },

  "Conditionnel présent": {
    etre: ["serais","serais","serait","serions","seriez","seraient"],
    avoir: ["aurais","aurais","aurait","aurions","auriez","auraient"],
    aller: ["irais","irais","irait","irions","iriez","iraient"],
    faire: ["ferais","ferais","ferait","ferions","feriez","feraient"],
    parler: ["parlerais","parlerais","parlerait","parlerions","parleriez","parleraient"],
    finir: ["finirais","finirais","finirait","finirions","finiriez","finiraient"],
    prendre: ["prendrais","prendrais","prendrait","prendrions","prendriez","prendraient"],
    venir: ["viendrais","viendrais","viendrait","viendrions","viendriez","viendraient"],
    pouvoir: ["pourrais","pourrais","pourrait","pourrions","pourriez","pourraient"],
    vouloir: ["voudrais","voudrais","voudrait","voudrions","voudriez","voudraient"],
    dire: ["dirais","dirais","dirait","dirions","diriez","diraient"],
    voir: ["verrais","verrais","verrait","verrions","verriez","verraient"]
  },

  "Subjonctif présent": {
    etre: ["sois","sois","soit","soyons","soyez","soient"],
    avoir: ["aie","aies","ait","ayons","ayez","aient"],
    aller: ["aille","ailles","aille","allions","alliez","aillent"],
    faire: ["fasse","fasses","fasse","fassions","fassiez","fassent"],
    parler: ["parle","parles","parle","parlions","parliez","parlent"],
    finir: ["finisse","finisses","finisse","finissions","finissiez","finissent"],
    prendre: ["prenne","prennes","prenne","prenions","preniez","prennent"],
    venir: ["vienne","viennes","vienne","venions","veniez","viennent"],
    pouvoir: ["puisse","puisses","puisse","puissions","puissiez","puissent"],
    vouloir: ["veuille","veuilles","veuille","voulions","vouliez","veuillent"],
    dire: ["dise","dises","dise","disions","disiez","disent"],
    voir: ["voie","voies","voie","voyions","voyiez","voient"]
  },

  "Passé composé": {
    etre: ["ai été","as été","a été","avons été","avez été","ont été"],
    avoir: ["ai eu","as eu","a eu","avons eu","avez eu","ont eu"],
    aller: ["suis allé(e)","es allé(e)","est allé(e)","sommes allé(e)s","êtes allé(e)(s)","sont allé(e)s"],
    faire: ["ai fait","as fait","a fait","avons fait","avez fait","ont fait"],
    parler: ["ai parlé","as parlé","a parlé","avons parlé","avez parlé","ont parlé"],
    finir: ["ai fini","as fini","a fini","avons fini","avez fini","ont fini"],
    prendre: ["ai pris","as pris","a pris","avons pris","avez pris","ont pris"],
    venir: ["suis venu(e)","es venu(e)","est venu(e)","sommes venu(e)s","êtes venu(e)(s)","sont venu(e)s"],
    pouvoir: ["ai pu","as pu","a pu","avons pu","avez pu","ont pu"],
    vouloir: ["ai voulu","as voulu","a voulu","avons voulu","avez voulu","ont voulu"],
    dire: ["ai dit","as dit","a dit","avons dit","avez dit","ont dit"],
    voir: ["ai vu","as vu","a vu","avons vu","avez vu","ont vu"]
  }
};

const verbs = {
  etre: "ÊTRE",
  avoir: "AVOIR",
  aller: "ALLER",
  faire: "FAIRE",
  parler: "PARLER",
  finir: "FINIR",
  prendre: "PRENDRE",
  venir: "VENIR",
  pouvoir: "POUVOIR",
  vouloir: "VOULOIR",
  dire: "DIRE",
  voir: "VOIR"
};

const colors = ["verb-title","green","blue","yellow","orange"];

let missingIndex = 0;

function showPanel(id, button) {
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  button.classList.add("active");
}

function createOptions() {
  const options = Object.entries(verbs)
    .map(([key,name]) => `<option value="${key}">${name}</option>`)
    .join("");

  document.getElementById("practiceVerb").innerHTML = options;
  document.getElementById("filterVerb").innerHTML =
    '<option value="all">Tous les verbes</option>' + options;

  document.getElementById("practiceTense").innerHTML =
    Object.keys(tenses).map(t => `<option>${t}</option>`).join("");
}

function makePractice() {
  const verb = document.getElementById("practiceVerb").value;
  const tense = document.getElementById("practiceTense").value;
  const answers = tenses[tense][verb];

  missingIndex = Math.floor(Math.random() * 6);

  let html = `<h3>${verbs[verb]} — ${tense}</h3>
    <table>
    <tr><th>Pronom</th><th>Conjugaison</th></tr>`;

  pronouns.forEach((p,i) => {
    html += `<tr>
      <td>${p}</td>
      <td>${i === missingIndex
        ? '<input class="answer" id="answer" placeholder="Ta réponse">'
        : answers[i]}
      </td>
    </tr>`;
  });

  html += "</table>";

  document.getElementById("practiceTable").innerHTML = html;
  document.getElementById("practiceResult").textContent = "";
  document.getElementById("answer").dataset.correct = answers[missingIndex];
}

function randomVerb() {
  const keys = Object.keys(verbs);
  const random = keys[Math.floor(Math.random() * keys.length)];

  document.getElementById("practiceVerb").value = random;
  makePractice();
}

function randomExercise() {
  const verbKeys = Object.keys(verbs);
  const tenseKeys = Object.keys(tenses);

  const randomVerbKey = verbKeys[Math.floor(Math.random() * verbKeys.length)];
  const randomTenseKey = tenseKeys[Math.floor(Math.random() * tenseKeys.length)];

  document.getElementById("practiceVerb").value = randomVerbKey;
  document.getElementById("practiceTense").value = randomTenseKey;

  makePractice();
}

function checkPractice() {
  const input = document.getElementById("answer");
  if (!input) return;

  const correct = input.dataset.correct.toLowerCase().trim();
  const answer = input.value.toLowerCase().trim();

  document.getElementById("practiceResult").textContent =
    answer === correct ? "Bravo ! C'est correct !" : "Essaie encore !";
}

function renderTables() {
  const filter = document.getElementById("filterVerb").value;
  const target = document.getElementById("allTables");
  target.innerHTML = "";

  Object.entries(verbs).forEach(([verb,name],index) => {
    if (filter !== "all" && filter !== verb) return;

    let html = `<div class="card">
      <h2 class="${colors[index % colors.length]}">${name}</h2>
      <table>
      <thead>
        <tr><th>Temps</th>${pronouns.map(p => `<th>${p}</th>`).join("")}</tr>
      </thead>
      <tbody>`;

    Object.entries(tenses).forEach(([tense,data]) => {
      html += `<tr>
        <td>${tense}</td>
        ${data[verb].map(a => `<td>${a}</td>`).join("")}
      </tr>`;
    });

    html += `</tbody></table></div>`;
    target.innerHTML += html;
  });
}

createOptions();
makePractice();
renderTables();
</script>

</body>
</html>
