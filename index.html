<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Ferrari</title>
  <style>
    :root {
      --rouge: #c62828;
      --jaune: #f2c94c;
      --encre: #34383d;
      --papier: rgba(255, 253, 248, .95);
      --vert: #e0f1e2;
      --vert-encre: #316b43;
      --erreur: #f5dfdc;
      --erreur-encre: #8d463b;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 18px;
      display: grid;
      place-items: center;
      color: var(--encre);
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 218, 172, .9), transparent 30%),
        linear-gradient(145deg, #f8efe2, #dce5eb);
      font-family: "Avenir Next", Avenir, system-ui, sans-serif;
      transition: background .4s ease;
    }

    body.avec-photo {
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }

    .page { width: min(820px, 100%); }

    .logo-ferrari {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 90px;
      padding: 7px 10px;
      border: 2px solid #d5ac3d;
      border-radius: 10px 10px 17px 17px;
      color: #233d2d;
      background: linear-gradient(180deg, #fff5c9, #e9c64b);
      box-shadow: 0 5px 12px rgba(0,0,0,.15);
      font-size: .72rem;
      font-weight: 1000;
      letter-spacing: .08em;
    }

    .logo-ferrari .cheval { font-size: 1.15rem; }

    .entete-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 12px;
    }

    .accueil,
    .quiz {
      width: 100%;
    }

    .panneau {
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 26px;
      background: var(--papier);
      box-shadow: 0 18px 45px rgba(45,40,35,.2);
      backdrop-filter: blur(12px);
    }

    .accueil {
      padding: clamp(22px, 5vw, 40px);
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    .accueil::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 9px;
      background: linear-gradient(90deg, #16843b 0 33%, #fff 33% 66%, #d52b2b 66%);
    }

    .accueil h1 {
      margin: 5px 0 8px;
      font-size: clamp(1.7rem, 6vw, 2.5rem);
    }

    .intro {
      max-width: 560px;
      margin: 0 auto 23px;
      line-height: 1.6;
    }

    .choix-categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }

    .categorie-bouton {
      min-height: 150px;
      padding: 17px 12px;
      border: 2px solid #eee4d8;
      border-radius: 20px;
      color: var(--encre);
      background:
        linear-gradient(145deg, rgba(255,255,255,.95), rgba(255,244,228,.92));
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }

    .categorie-bouton:hover {
      transform: translateY(-3px);
      border-color: var(--rouge);
      box-shadow: 0 10px 20px rgba(132,45,36,.12);
    }

    .categorie-bouton .icone {
      display: block;
      margin-bottom: 10px;
      font-size: 2rem;
    }

    .categorie-bouton small {
      display: block;
      margin-top: 6px;
      font-weight: 500;
      opacity: .75;
    }

    .decorations {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 22px;
      padding-top: 15px;
      border-top: 1px solid #eee3d7;
    }

    .decorations img {
      width: min(42%, 230px);
      height: 92px;
      border-radius: 14px;
      object-fit: cover;
      box-shadow: 0 5px 16px rgba(0,0,0,.14);
    }

    .quiz { display: none; }
    .quiz.visible { display: block; }

    .quiz-entete {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .titre-quiz {
      margin: 0;
      font-size: clamp(1.1rem, 4vw, 1.65rem);
    }

    .outils-entete {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .compteur {
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,.88);
      font-size: .9rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .bouton-menu {
      padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 999px;
      color: var(--encre);
      background: rgba(255,255,255,.85);
      font: inherit;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .progression {
      height: 8px;
      margin-bottom: 13px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(50,50,50,.12);
    }

    #barre {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--rouge);
      transition: width .25s ease;
    }

    .carte-question {
      min-height: 420px;
      padding: clamp(20px, 5vw, 36px);
      overflow: hidden;
    }

    .logos-question {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .etiquette {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      color: #773c2d;
      background: #f4e3d4;
      font-size: .8rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    #question {
      margin: 5px 0 20px;
      font-size: clamp(1.15rem, 4vw, 1.55rem);
      line-height: 1.4;
    }

    #reponses {
      display: grid;
      gap: 10px;
    }

    .reponse {
      width: 100%;
      min-height: 52px;
      padding: 12px 15px;
      border: 2px solid #e8e3dc;
      border-radius: 15px;
      color: var(--encre);
      background: rgba(255,255,255,.96);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .reponse:hover { border-color: var(--rouge); }
    .reponse:disabled { cursor: default; opacity: 1; }

    .reponse.correcte {
      border-color: #84b692;
      color: var(--vert-encre);
      background: var(--vert);
    }

    .reponse.fausse {
      border-color: #d6a49c;
      color: var(--erreur-encre);
      background: var(--erreur);
    }

    #correction {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-left: 4px solid var(--rouge);
      border-radius: 8px;
      background: #faf4ed;
      line-height: 1.5;
    }

    #correction.visible { display: block; }

    #suivant {
      display: none;
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 999px;
      color: white;
      background: var(--rouge);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    #suivant.visible { display: block; }

    #fin {
      display: none;
      padding: 25px 10px;
      text-align: center;
    }

    #fin.visible { display: block; }

    #score-final {
      margin: 10px;
      color: var(--rouge);
      font-size: 3rem;
      font-weight: 900;
    }

    .logo-bas {
      display: flex;
      justify-content: center;
      margin-top: 15px;
    }

    @media (max-width: 620px) {
      body { padding: 10px; }
      .choix-categories { grid-template-columns: 1fr; }
      .categorie-bouton { min-height: 105px; }
      .decorations img { height: 72px; }
      .quiz-entete { align-items: flex-start; }
      .compteur { font-size: .78rem; }
      .bouton-menu { font-size: .78rem; }
      .carte-question { min-height: 390px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="entete-logo">
      <div class="logo-ferrari" role="img" aria-label="Logo inspiré de Ferrari">
        <span class="cheval">🐎</span><span>FERRARI</span>
      </div>
    </div>

    <section class="accueil panneau" id="accueil">
      <h1>Le grand quiz Ferrari 🏁</h1>
      <p class="intro">
        Choisissez votre thème et testez vos connaissances sur les voitures,
        les pilotes, les responsables et les courses de Ferrari.
      </p>

      <div class="choix-categories">
        <button class="categorie-bouton" data-categorie="modeles" type="button">
          <span class="icone">🏎️</span>
          Modèles de voitures
          <small>Les Ferrari de route et leurs caractéristiques</small>
        </button>

        <button class="categorie-bouton" data-categorie="pilotes" type="button">
          <span class="icone">🏆</span>
          Pilotes et responsables
          <small>Les pilotes et les dirigeants de la Scuderia</small>
        </button>

        <button class="categorie-bouton" data-categorie="courses" type="button">
          <span class="icone">🏁</span>
          Courses
          <small>Grands Prix et résultats de Ferrari</small>
        </button>
      </div>

      <div class="decorations">
        <img
          src="https://images.unsplash.com/photo-1592198084033-aade902d1aae?auto=format&fit=crop&w=900&q=82"
          alt="Voiture de sport rouge dans un décor ensoleillé"
          loading="lazy">
        <div class="logo-ferrari" role="img" aria-label="Logo inspiré de Ferrari">
          <span class="cheval">🐎</span><span>FERRARI</span>
        </div>
        <img
          src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=900&q=82"
          alt="Voiture de sport photographiée sur la route"
          loading="lazy">
      </div>
    </section>

    <section class="quiz" id="quiz">
      <header class="quiz-entete">
        <h1 class="titre-quiz" id="titreCategorie">Quiz Ferrari</h1>
        <div class="outils-entete">
          <div class="compteur">
            <span id="numero">1</span>/<span id="total">10</span>
            · <span id="score">0</span> point(s)
          </div>
          <button class="bouton-menu" id="retourMenu" type="button">Menu</button>
        </div>
      </header>

      <div class="progression"><div id="barre"></div></div>

      <section class="carte-question panneau">
        <div id="contenu">
          <div class="logos-question">
            <span class="etiquette" id="etiquette"></span>
            <div class="logo-ferrari" role="img" aria-label="Logo inspiré de Ferrari">
              <span class="cheval">🐎</span><span>FERRARI</span>
            </div>
          </div>

          <h2 id="question"></h2>
          <div id="reponses"></div>
          <div id="correction" role="status"></div>
          <button id="suivant" type="button">Continuer</button>
        </div>

        <div id="fin">
          <h2>Quiz terminé !</h2>
          <div id="score-final"></div>
          <p id="message-final"></p>
          <button class="bouton-menu" id="retourFin" type="button">Choisir un autre thème</button>
          <div class="logo-bas">
            <div class="logo-ferrari" role="img" aria-label="Logo inspiré de Ferrari">
              <span class="cheval">🐎</span><span>FERRARI</span>
            </div>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script>
    "use strict";

    const IMAGE_FERRARI =
      "https://images.unsplash.com/photo-1592198084033-aade902d1aae?auto=format&fit=crop&w=1600&q=82";
    const IMAGE_COURSE =
      "https://images.unsplash.com/photo-1532906619279-a4b7267faa5a?auto=format&fit=crop&w=1600&q=82";
    const IMAGE_PORSCHE =
      "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1600&q=82";

    const QUESTIONS = {
      modeles: [
        {
          question: "Est-ce que le vollant de la Ferrari Luce a le volant parfaitement rond ? Ou il est peut-être un peu droit en bas?",
          reponses: ["Il est complètement rond", "Non, il est droit en bas"],
          bonne: 1,
          image: IMAGE_FERRARI
        },
        {
          question: "Le toit de la Ferrari amalfi spider se plie en combien lorsqu'il se met dans le compartiment arrière?",
          reponses: ["2", "3", "4", "5"],
          bonne: 1,
          image: IMAGE_FERRARI
        },
        {
          question: "La Ferrari 849 Testarossa a quoi comme type de moteur??",
          reponses: ["V12", "V6", "V10", "V8"],
          bonne: 3,
          image: IMAGE_FERRARI
        },
        {
          question: "Combien de chevaux a la Ferrari Testarossa?",
          reponses: ["1050cv", "1200cv", "620cv", "830cv"],
          bonne: 0,
          image: IMAGE_FERRARI
        },
        {
          question: "Quel type de porte a la Ferrari Enzo?",
          reponses: ["porte antsgoniste", "porte papillon", "porte normale", "porte élytre"],
          bonne: 3,
          image: IMAGE_FERRARI
        },
        {
          question: "Combien de places a Ferrari Daytona SP3?",
          reponses: ["1 place", "2 places", "3 places", "4 places ou plus"],
          bonne: 1,
          image: IMAGE_FERRARI
        },
        {
          question: "Quelle a été la première voiture créée par la fameuse marque de supercars Ferrari?",
          reponses: ["Ferrari 125 S", "Ferrari 159 S", "The Ferrari 125 S"],
          bonne: 0,
          image: IMAGE_FERRARI
        },
        {
          question: "Quelle est la puissance de la première Ferrari?(elle est en kW donc kilowatts)",
          reponses: ["80kW", "68kW", "87kW", "90kW"],
          bonne: 2,
          image: IMAGE_FERRARI
        },
        {
          question: "La Ferrari 296 spéciale a elle une vitre transparente à l'arrière laissant voir le moteur?",
          reponses: ["oui", "non"],
          bonne: 0,
          image: IMAGE_FERRARI
        },
        {
          question: "La Ferrari 159 S a-elle des fenêtres?",
          reponses: ["oui, elle a 2 fenêtres", "non, elle est complètement découverte en haut"],
          bonne: 1,
          image: IMAGE_FERRARI
        }
      ],

      pilotes: [
        {
          question: "Quelle de ces phrases a dit Charles Leclerc quand il était encore un enfant?",
          reponses: [
            "\"When I was little, my dream was to become an F1 driver, because I used to watch it on TV with my parents.\"",
            "\"Ever since I was a kid, my most heartfelt dream was to be able to drive the red car and I’ve managed to make it come true.\"",
            "\"Ever since I was a child, my biggest dream was to drive a Ferrari.\""
          ],
          bonne: 1,
          image: IMAGE_COURSE
        },
        {
          question: "En quelle année est né Charles Leclerc?",
          reponses: ["2000", "2002", "1997", "1998"],
          bonne: 2,
          image: IMAGE_COURSE
        },
        {
          question: "Est ce que Charles Leclerc fait la taille du papa de Yohan?",
          reponses: ["oui", "non"],
          bonne: 0,
          image: IMAGE_COURSE
        },
        {
          question: "Charles Leclerc est déjà arrivé au podium avec une autre compagnie?",
          reponses: ["oui, quelques fois", "non, aucune fois"],
          bonne: 1,
          image: IMAGE_COURSE
        },
        {
          question: "Lewis Hamilton est plus âgé que t freres et ta soeur? Il est né en quelle année?",
          reponses: ["1985", "1995", "1990", "1987"],
          bonne: 0,
          image: IMAGE_COURSE
        },
        {
          question: "Lewis Hamilton est arrivé au podium plus de 200 fois??",
          reponses: ["oui", "non"],
          bonne: 0,
          image: IMAGE_COURSE
        },
        {
          question: "Lewis Hamilton a déjà gagné combien de titres de champion mondial?",
          reponses: ["4", "7", "5", "6"],
          bonne: 1,
          image: IMAGE_COURSE
        },
        {
          question: "Où Frédéric Vasseur a fait l'École Supérieure des Techniques Aéronautiques et de Construction Automobile en 1995?",
          reponses: ["Suisse", "allemagne", "France", "Autriche"],
          bonne: 2,
          image: IMAGE_COURSE
        },
        {
          question: "En quelle année est né Frédéric Vasseur?",
          reponses: [
            "en mai (COMME MOI ET TA MAMAN)",
            "en avril(comme ma mereee)",
            "en août (comme Laurene et ton pereee)"
          ],
          bonne: null,
          image: IMAGE_COURSE
        }
      ],

      courses: [
        {
          question: "Quand sera le prochain grand prix de Qatar?",
          reponses: ["le 29 novembre", "le 30 novembre", "le 29 décembre"],
          bonne: 0,
          image: IMAGE_COURSE
        },
        {
          question: "En quelle place sont restés Lewis Hamilton et Charles Leclerc dans le São Paulo grand prix ?",
          reponses: ["4eme et 5eme", "8eme et 11eme", "9eme et 8eme"],
          bonne: 2,
          image: IMAGE_COURSE
        },
        {
          question: "Au grand prix 2026 des États-Unis, qui est resté en deuxième place?",
          reponses: ["Lewis Hamilton", "Charles Leclerc"],
          bonne: 1,
          image: IMAGE_COURSE
        },
        {
          question: "Au Barcelona-Cataluña grand prix, un des deux pilotes de Ferrari a fini en première place?",
          reponses: ["oui", "non"],
          bonne: 0,
          image: IMAGE_COURSE
        },
        {
          question: "Quelle était la vélocité maximale de Lewis Hamilton dans le grand prix d'Italie?",
          reponses: ["289.748km/h", "294.794km/h", "333.100km/h"],
          bonne: null,
          image: IMAGE_COURSE
        }
      ]
    };

    const NOMS_CATEGORIES = {
      modeles: "Modèles de voitures",
      pilotes: "Pilotes et responsables",
      courses: "Courses"
    };

    let categorieActive = "";
    let indexQuestion = 0;
    let score = 0;
    let correctionAffichee = false;

    const accueil = document.getElementById("accueil");
    const quiz = document.getElementById("quiz");
    const titreCategorie = document.getElementById("titreCategorie");
    const numero = document.getElementById("numero");
    const total = document.getElementById("total");
    const scoreElement = document.getElementById("score");
    const barre = document.getElementById("barre");
    const etiquette = document.getElementById("etiquette");
    const questionElement = document.getElementById("question");
    const reponsesElement = document.getElementById("reponses");
    const correctionElement = document.getElementById("correction");
    const boutonSuivant = document.getElementById("suivant");
    const contenu = document.getElementById("contenu");
    const fin = document.getElementById("fin");

    function afficherFond(image) {
      if (!image) {
        document.body.classList.remove("avec-photo");
        document.body.style.backgroundImage = "";
        return;
      }

      document.body.classList.add("avec-photo");
      document.body.style.backgroundImage =
        `linear-gradient(rgba(247,241,231,.58), rgba(247,241,231,.58)), url("${image}")`;
    }

    function ouvrirCategorie(categorie) {
      categorieActive = categorie;
      indexQuestion = 0;
      score = 0;
      accueil.hidden = true;
      quiz.classList.add("visible");
      titreCategorie.textContent = NOMS_CATEGORIES[categorie];
      afficherQuestion();
    }

    function afficherQuestion() {
      const liste = QUESTIONS[categorieActive];

      if (indexQuestion >= liste.length) {
        afficherFin();
        return;
      }

      correctionAffichee = false;
      const element = liste[indexQuestion];

      afficherFond(element.image);
      contenu.style.display = "block";
      fin.classList.remove("visible");
      correctionElement.classList.remove("visible");
      correctionElement.textContent = "";
      boutonSuivant.classList.remove("visible");

      numero.textContent = String(indexQuestion + 1);
      total.textContent = String(liste.length);
      scoreElement.textContent = String(score);
      barre.style.width = `${(indexQuestion / liste.length) * 100}%`;
      etiquette.textContent = NOMS_CATEGORIES[categorieActive];
      questionElement.textContent = element.question;
      reponsesElement.replaceChildren();

      element.reponses.forEach((texte, choix) => {
        const bouton = document.createElement("button");
        bouton.type = "button";
        bouton.className = "reponse";
        bouton.textContent = texte;

        bouton.addEventListener("click", evenement => {
          evenement.stopPropagation();
          choisirReponse(choix);
        });

        reponsesElement.appendChild(bouton);
      });
    }

    function choisirReponse(choix) {
      if (correctionAffichee) return;
      correctionAffichee = true;

      const element = QUESTIONS[categorieActive][indexQuestion];
      const boutons = [...reponsesElement.querySelectorAll(".reponse")];

      boutons.forEach((bouton, index) => {
        bouton.disabled = true;

        if (element.bonne !== null && index === element.bonne) {
          bouton.classList.add("correcte");
        }

        if (index === choix && element.bonne !== null && choix !== element.bonne) {
          bouton.classList.add("fausse");
        }
      });

      if (element.bonne === null) {
        correctionElement.textContent =
          "Réponse correcte non indiquée pour cette question. Vous pouvez continuer.";
      } else if (choix === element.bonne) {
        score++;
        scoreElement.textContent = String(score);
        correctionElement.textContent = "✅ Bonne réponse !";
      } else {
        correctionElement.textContent =
          `❌ Mauvaise réponse. La bonne réponse est « ${element.reponses[element.bonne]} ».`;
      }

      correctionElement.classList.add("visible");
      boutonSuivant.classList.add("visible");
    }

    function questionSuivante() {
      if (!correctionAffichee) return;
      indexQuestion++;
      afficherQuestion();
    }

    function afficherFin() {
      afficherFond("");
      contenu.style.display = "none";
      fin.classList.add("visible");
      barre.style.width = "100%";

      const nombreQuestions = QUESTIONS[categorieActive].length;
      document.getElementById("score-final").textContent = `${score}/${nombreQuestions}`;

      let message = "Quiz terminé ! Vous pouvez choisir un autre thème.";
      if (score === nombreQuestions) message = "Excellent ! Toutes vos réponses sont correctes.";
      else if (score >= Math.ceil(nombreQuestions * .7)) message = "Très bon résultat !";

      document.getElementById("message-final").textContent = message;
    }

    function retournerAuMenu() {
      quiz.classList.remove("visible");
      accueil.hidden = false;
      afficherFond("");
    }

    document.querySelectorAll("[data-categorie]").forEach(bouton => {
      bouton.addEventListener("click", () => {
        ouvrirCategorie(bouton.dataset.categorie);
      });
    });

    boutonSuivant.addEventListener("click", evenement => {
      evenement.stopPropagation();
      questionSuivante();
    });

    document.addEventListener("click", evenement => {
      if (!correctionAffichee) return;
      if (evenement.target.closest("#suivant")) return;
      if (evenement.target.closest("#retourMenu")) return;
      if (evenement.target.closest("#retourFin")) return;

      questionSuivante();
    });

    document.getElementById("retourMenu").addEventListener("click", retournerAuMenu);
    document.getElementById("retourFin").addEventListener("click", retournerAuMenu);
  </script>
</body>
</html>
